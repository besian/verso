<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" onload="this.onload=null;this.rel='stylesheet'">

<style>
  /* Shown straight from the HTML while the app loads; React replaces it. */
  .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #F4F1E9; }
  .boot span { font: 400 46px/1 'Instrument Serif', Georgia, serif; letter-spacing: -.01em; color: #222320; animation: boot 1.6s ease-in-out infinite alternate; }
  .boot b { font-weight: 400; color: #AD493A; }
  :root[data-theme="dark"] .boot { background: #1A1B18; } :root[data-theme="dark"] .boot span { color: #ECE7DB; } :root[data-theme="dark"] .boot b { color: #D7705B; }
  @keyframes boot { from { opacity: .55 } to { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .boot span { animation: none; } }
</style>
<link rel="stylesheet" href="/src/global.css">
